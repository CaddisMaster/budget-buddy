# The site file is production's, byte for byte. This role writes that file, its
# enabled link and the empty web root, and nothing else: the page arrives through
# landing-deploy, and the headers snippet is the other repo's (SETUP.md §9), so it
# is only checked. Writing it could change the live site's headers.
- name: The web root
  ansible.builtin.file:
    path: "{{ www_site_root }}"
    state: directory
    owner: "{{ www_site_user }}"
    group: "{{ www_site_user }}"
    mode: "0755"

- name: Look at the files the www site names
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ www_site_snippet }}"
    - /etc/letsencrypt/live/{{ www_site_name }}/fullchain.pem
    - /etc/letsencrypt/live/{{ www_site_name }}/privkey.pem
    - /etc/letsencrypt/options-ssl-nginx.conf
    - /etc/letsencrypt/ssl-dhparams.pem
  register: www_site_files

- name: The www site's files exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} is missing. This role writes neither the certificate nor the
      headers snippet: see RUNBOOK §4 and seandesmet.com's SETUP.md §9, then run again.
    quiet: true
  loop: "{{ www_site_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: The www site
  ansible.builtin.copy:
    src: "{{ www_site_name }}"
    dest: /etc/nginx/sites-available/{{ www_site_name }}
    owner: root
    group: root
    mode: "0644"
  notify: www site changed

- name: The www site is enabled
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ www_site_name }}
    dest: /etc/nginx/sites-enabled/{{ www_site_name }}
    state: link
  notify: www site changed

# Now, not at the end of the play: a later role's refusal would otherwise leave a
# changed file unreloaded, and the next run would see no change to act on.
- name: Apply a www site change before the next role
  ansible.builtin.meta: flush_handlers
