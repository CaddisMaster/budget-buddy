# Budget Buddy's layer of the shared Droplet (#531), its backups (#532) and www's
# site, on top of the host layer (host.yml). Separate roles: www's content is another repo's, so
# its role can move there later without changing Budget Buddy's.
- name: Budget Buddy and www on the Droplet
  hosts: droplet
  become: true
  roles:
    - budget_buddy_app
    - www_site
    - budget_buddy_backup
