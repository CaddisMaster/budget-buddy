[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*

# ⚠️ loadgroup, not the default `load` (#157). Identical scheduling for every
# ungrouped test — but a test marked `@pytest.mark.xdist_group("name")` is
# guaranteed to land on the SAME worker as every other test in that group, which
# is the only way to stop two workers running a global sweep at the same instant.
#
# The sweep in question is reminders.send_due_reminders(). It reads
# `SELECT DISTINCT user_id FROM push_subscriptions` with no user filter — correct,
# it is the daily job for everybody — so a call from one worker also processes
# every OTHER worker's users. It CLAIMS each occurrence in reminder_log with
# ON CONFLICT DO NOTHING before sending, and that claim is the lock. A worker
# whose occurrence was already claimed by a neighbour therefore sends nothing,
# and the neighbour delivered it through the WRONG process's mocked seam.
#
# TEST_PREFIX cannot help here: it isolates rows, and this is contention over a
# global operation rather than over a row. Grouping is the fix — see the module
# docstrings in tests/test_push_reminders.py and tests/test_job_runs.py.
#
# Lives here rather than in test.sh because CI invokes `pytest` directly (twice,
# in ci.yml), so test.sh is not on every path this must hold for.
addopts = --dist loadgroup
