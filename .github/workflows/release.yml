name: Release

# Publishing a GitHub Release is the deploy trigger. Building on tag push instead
# would fire before the notes exist; the Release is the deliberate human act.
on:
  release:
    types: [published]

permissions:
  contents: read

# Two releases deploying at once would race on the Droplet. Never cancel a
# release run in flight — cancelling between `pull` and `up -d` would leave the
# host half-deployed.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/caddismaster/budget-buddy

jobs:
  build-push:
    name: Build and push to ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive tags
        id: meta
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Release tags are `vX.Y.Z`; image tags drop the leading v.
          version="${TAG_NAME#v}"
          sha_short="$(git rev-parse --short HEAD)"

          # Every image is traceable to a version AND a commit.
          tags="${IMAGE}:${version},${IMAGE}:sha-${sha_short}"

          # A pre-release must never move `latest` — that is the tag the Droplet
          # falls back to. Test releases stay fully addressable by version only.
          if [ "$PRERELEASE" = "false" ]; then
            tags="${tags},${IMAGE}:latest"
          else
            echo "::notice::Pre-release ${TAG_NAME} — not tagging :latest"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # #305 — the image is stamped with both, so the running container can
          # be asked what it is. Published from HERE rather than recomputed at
          # the build step: a second derivation is a second thing that can
          # disagree with the tag the image actually ships under.
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token can push to this repo's package. No PAT, no
          # Docker Hub-style secret to rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The Droplet is amd64. We deliberately do not build arm64: the local
          # Mac staging smoke it existed for now runs in the `smoke` job below.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # #305 — bake the identity into the image itself. The deploy step
          # below asks the running container for these back, which is how a
          # half-finished swap stops reporting success.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Pushed image boots and serves /healthz
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # This job is the gate that replaces the old Mac-side staging step. It runs
    # the exact artifact that was just pushed — not a local rebuild — so the
    # thing approved for deploy is the thing that was tested.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load schema
        run: psql "postgresql://budget:budget@localhost:5432/budget" -f sql/schema.sql

      - name: Run the pushed image
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          docker run -d --name smoke --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=budget \
            -e DB_USER=budget -e DB_PASSWORD=budget \
            -e SECRET_KEY=smoke-test-key \
            "${IMAGE}:${VERSION}"

          # AI and email vars are deliberately unset: those features self-disable
          # via ai_enabled()/mail_enabled(), and a degraded boot is still a valid
          # "does it come up and serve" check. Never wire real keys in here.

      - name: /healthz returns 200
        run: |
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Pushed image did not serve /healthz. Logs:"
            docker logs smoke
            exit 1
          fi
          echo "GET /healthz -> 200"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

  deploy:
    name: Deploy to the Droplet
    needs: [build-push, smoke]
    runs-on: ubuntu-latest
    # The approval gate. This is the old build -> stage -> promote discipline
    # reduced to one click. The deploy secrets are scoped to this environment,
    # so no un-gated job in this repo can read the SSH key.
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
          # A variable, not a secret: the username is not sensitive, and as a
          # secret Actions redacted the literal string "deploy" throughout the
          # logs — including inside ordinary words ("Verify the ***ed app").
          USER_NAME: ${{ vars.DROPLET_USER }}
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key — StrictHostKeyChecking=no would accept anything
          # answering on that IP, which is the whole attack this prevents.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Order is load-bearing and the two directions are opposites:
          #   dump -> additive migrations -> pull -> up -> destructive migrations
          # Additive changes must land BEFORE the new image, because new code
          # must never query a column that does not exist yet. DROPs are the
          # reverse: the old container still SELECTs them right up until the swap
          # completes, so they land AFTER.
          #
          # #277 — both directions are now the pipeline's job. Each migration
          # declares its phase in a header pragma (`-- deploy: after-pull`;
          # silence means additive), `migrate.py --phase` filters on it, and this
          # job runs the runner twice, either side of `up -d`. Before that, step 2
          # applied EVERY pending file and this comment claimed drops "stay a
          # manual step" — which was simply false, and false in the direction that
          # tells a reader the risk is covered. `sql/36` shipped through it at
          # 0.8.0 against a v0.7.0 image that still read both dropped tables.
          #
          # The guard is tests/test_migration_phases.py, not this comment: a DROP
          # with no pragma fails the suite. Do not re-collapse these into one call.
          #
          # `pull web`, never a bare `pull`: a bare pull also fetches postgres,
          # and `up -d` then recreates the database container. Shipping app code
          # must never upgrade or restart the database engine as a side effect.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              "${USER_NAME}@${HOST}" \
              "set -e
               cd /opt/budget-buddy

               # 0. Pin the version this box runs into .env, FIRST — before any
               #    other compose command, including the pg_dump below, which is
               #    a bare \`docker compose exec\`. Since #190 the image reads
               #    \${TAG} with NO default, so an .env missing this line makes
               #    every compose command fail naming TAG. That is the intent: the
               #    old \`:-latest\` fallback silently reverted production to a
               #    stale local image. Rewritten in place, so exactly one TAG line
               #    survives, and chmod'd before it is written — a redirect creates
               #    the temp file at the umask default, and this file holds every
               #    production secret.
               #
               #    The explicit \`TAG=\` prefixes further down are what makes THIS
               #    deploy work against an .env that does not have the line yet; a
               #    command-line value beats the file either way.
               touch .env.tmp
               chmod 600 .env.tmp
               grep -v '^TAG=' .env > .env.tmp
               printf 'TAG=%s\n' '${VERSION}' >> .env.tmp
               mv .env.tmp .env
               echo \"pinned \$(grep '^TAG=' .env)\"

               # 1. Back up before touching the schema. The database is the only
               #    irreplaceable artifact here, so a failed dump fails the deploy.
               source ./.env
               DUMP=\"backups/pre-deploy-\$(date +%Y%m%d-%H%M%S).sql.gz\"
               mkdir -p backups
               docker compose exec -T db pg_dump -U \"\$DB_USER\" \"\$DB_NAME\" | gzip > \"\$DUMP\"
               gzip -t \"\$DUMP\"
               echo \"backup ok: \$DUMP (\$(stat -c%s \"\$DUMP\") bytes)\"

               # 2. Apply the ADDITIVE migrations, using the image being
               #    deployed so the runner and the migrations always match the
               #    release. An empty pass is normal and exits 0 — most releases
               #    carry migrations for one phase only.
               TAG='${VERSION}' docker compose run --rm --no-deps -T \\
                 -e DB_HOST=db web python scripts/migrate.py --phase before-pull

               # 3. Only now swap the application.
               TAG='${VERSION}' docker compose pull web
               TAG='${VERSION}' docker compose up -d

               # 3b. Assert the container that came up IS this release, before
               #    anything irreversible happens below (#305). Ordering is
               #    load-bearing: step 4 applies DROPs, and by #277's reasoning
               #    those are only safe once the NEW image is serving. If the
               #    swap silently left the old one up, dropping tables it still
               #    SELECTs is the exact outage #277 exists to prevent — so this
               #    runs while the only thing that has happened is a swap.
               #
               #    \`/healthz\` cannot answer this: it returns 200 from any
               #    version, which is how production once sat three releases
               #    stale with every indicator green (#190).
               RUNNING=\"\$(docker compose exec -T web printenv APP_VERSION | tr -d '\r')\"
               if [ \"\$RUNNING\" != '${VERSION}' ]; then
                 echo \"::error::Deployed ${VERSION} but the running container reports '\$RUNNING'\"
                 exit 1
               fi
               echo \"running version \$RUNNING (matches ${VERSION})\"

               # 4. And only now the DROPs — the old container has stopped, so
               #    nothing is still SELECTing what is about to disappear.
               #
               #    A failure here does NOT leave production broken: the new
               #    image is already up and serving, and by rule 2 of #277 an
               #    after-pull migration adds no schema that image needs. The
               #    release still goes red, which is right — the drop must be
               #    finished by hand — but the app stays healthy meanwhile.
               TAG='${VERSION}' docker compose run --rm --no-deps -T \\
                 -e DB_HOST=db web python scripts/migrate.py --phase after-pull

               docker compose ps"

          # TAG pins the exact released image, and step 0 above wrote it into the
          # Droplet's `.env` so the box keeps naming this version.
          #
          # ⚠️ This comment used to say the compose file consumes it as
          # `${TAG:-latest}`, "so a hand-run `docker compose up -d` still works".
          # Both halves were wrong, and wrong in the dangerous direction — it was
          # describing the behaviour #190 deliberately REMOVED, and recommending
          # the exact command that caused the incident. `docker-compose.yml` reads
          # `${TAG:?TAG is not set …}`: with no TAG, every compose command FAILS
          # naming the variable. That is the intent. The old `:-latest` default is
          # what once silently reverted production three releases with every
          # indicator green, and the same line 70 lines above this one already
          # says so. Corrected in #309 tranche 9.

      - name: Verify the deployed app is healthy
        run: |
          # A deploy that silently half-worked is worse than a red run.
          ok=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   https://budget.seandesmet.com/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "attempt $i: /healthz -> $code"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Deploy finished but https://budget.seandesmet.com/healthz is not 200."
            exit 1
          fi
          echo "Deployed and healthy."

      # #115 — tell every subscribed device the release is live. Deliberately
      # AFTER the health check: nothing is announced unless the deploy worked.
      # Skipped for a pre-release, for the same reason one never moves `latest` —
      # a throwaway test release must not notify real people.
      - name: Announce the release to subscribed devices
        if: github.event.release.prerelease == false
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER_NAME: ${{ vars.DROPLET_USER }}
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          # The notification body is a fixed line inside the image (#131), so the
          # ONLY thing crossing this boundary is the version — a tag this
          # workflow derived itself, not free text a human typed. That is what
          # removes the injection surface entirely rather than guarding it: an
          # earlier revision carried the Release notes and needed a base64 hop to
          # keep quotes and $(...) out of the remote shell. Do not reintroduce a
          # human-authored string here without bringing that guard back.
          #
          # A failed announcement must never fail the release — the deploy has
          # already succeeded and been verified. Warn and move on.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              "${USER_NAME}@${HOST}" \
              "set -e
               cd /opt/budget-buddy
               TAG='${VERSION}' docker compose run --rm --no-deps -T \\
                 -e DB_HOST=db \\
                 web flask announce-release --version '${VERSION}'" \
            || echo "::warning::Release deployed, but the push announcement failed."

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
