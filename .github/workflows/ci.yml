name: CI

on:
  push:
    # Only branches that matter. Without this, a Dependabot branch push and its
    # pull_request event both trigger a run — the same commits tested twice.
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. This workflow only ever reads the repository;
# anything needing more asks for it explicitly at the job level.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes. Pushes to main
# are never cancelled — those runs gate the deployable state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the steps run.
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: budget
      DB_USER: budget
      DB_PASSWORD: budget
      SECRET_KEY: ci-secret-key
      # ENABLE_DIGEST_SCHEDULER and COOKIE_SECURE are deliberately unset. The
      # first would start the mail scheduler; the second sets Secure-only
      # cookies, which the test client — plain http — would never send back.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Load schema
        run: psql "postgresql://budget:budget@localhost:5432/budget" -f sql/schema.sql

      - name: Run tests
        run: pytest -q

  migrations:
    name: Migrations apply to the current schema
    runs-on: ubuntu-latest

    # The plan for this phase wanted CI to assert that schema.sql and the
    # numbered migrations produce identical schemas. That is impossible here:
    # the numbered files are forward-only deltas, not a replayable history —
    # `users` is created only in schema.sql, and replaying from empty yields 4
    # tables of 13. So this job asserts the property that actually matters and
    # is actually true: a database built from schema.sql accepts every pending
    # migration cleanly, which is exactly the operation production performs.

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: budget
      DB_USER: budget
      DB_PASSWORD: budget

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Build the database from schema.sql
        run: psql "postgresql://budget:budget@localhost:5432/budget" -f sql/schema.sql

      - name: Baseline, then apply anything newer
        run: |
          # schema.sql already contains everything up to the highest numbered
          # migration, so baseline records them rather than re-running them.
          python scripts/migrate.py --baseline
          # Any migration added in this PR is NOT yet in schema.sql, so it is
          # pending here and gets applied for real. That is the assertion.
          python scripts/migrate.py

      - name: Runner is idempotent
        run: |
          out=$(python scripts/migrate.py)
          echo "$out"
          if ! echo "$out" | grep -q "up to date"; then
            echo "::error::Second run was not a no-op — the runner is not idempotent."
            exit 1
          fi

      - name: A new migration must also be reflected in schema.sql
        run: |
          # The drift this catches: adding sql/NN without updating schema.sql,
          # so a fresh database silently lacks what production has. Compares
          # against the merge base rather than the whole history.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}" || true
          base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo "")
          [ -z "$base" ] && { echo "no merge base — skipping"; exit 0; }

          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'sql/[0-9]*.sql' || true)
          if [ -z "$added" ]; then
            echo "No new migration in this change."
            exit 0
          fi
          echo "New migration(s): $added"

          if git diff --name-only "$base" HEAD -- sql/schema.sql | grep -q .; then
            echo "schema.sql updated alongside it."
          else
            echo "::error::$added was added but sql/schema.sql was not updated."
            echo "schema.sql builds fresh databases (dev, CI, a rebuilt server)."
            echo "Leaving it behind means a fresh database silently lacks this change."
            exit 1
          fi

  docker-build:
    name: Image builds and runs as non-root
    runs-on: ubuntu-latest
    # Nothing here needs the registry — this job proves the image is sound, it
    # does not publish it. Pushing happens in the release workflow.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: budget-buddy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The reason this job exists. Until now CI installed dependencies on the
      # runner and ran pytest against them — it never built the Dockerfile at
      # all. A broken Dockerfile, or a regression in the non-root user change,
      # would have sailed through completely untested.
      - name: Container runs as the unprivileged appuser
        run: |
          actual=$(docker run --rm budget-buddy:ci whoami)
          echo "container user: $actual"
          if [ "$actual" != "appuser" ]; then
            echo "::error::Image runs as '$actual', expected 'appuser'."
            exit 1
          fi

      - name: Gunicorn boots and serves a request
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_USER=budget -e POSTGRES_PASSWORD=budget -e POSTGRES_DB=budget \
            postgres:16
          # Give Postgres a moment; the app only needs it once a request touches
          # the database, but a clean boot is what we are asserting here.
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U budget >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec -i ci-db psql -U budget -d budget < sql/schema.sql

          docker run -d --name ci-web --network ci-net -p 5001:5000 \
            -e DB_HOST=ci-db -e DB_PORT=5432 -e DB_NAME=budget \
            -e DB_USER=budget -e DB_PASSWORD=budget \
            -e SECRET_KEY=ci-secret-key \
            budget-buddy:ci

          # The login page is unauthenticated, so a 200 proves the whole stack
          # came up: gunicorn, the app factory, and the template layer.
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/login || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::App did not serve /login. Container logs:"
            docker logs ci-web
            exit 1
          fi
          echo "GET /login -> 200"

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-web || true
