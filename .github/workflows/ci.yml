name: CI

on:
  push:
    # Only branches that matter. Without this, a Dependabot branch push and its
    # pull_request event both trigger a run — the same commits tested twice.
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. This workflow only ever reads the repository;
# anything needing more asks for it explicitly at the job level.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes. Pushes to main
# are never cancelled — those runs gate the deployable state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # One source of truth for "can this change affect X", consumed by the jobs
    # below. Every job keeps RUNNING and gates its expensive STEPS on these
    # outputs. It is tempting to put `paths-ignore` on the jobs instead — do not.
    # These are required status checks, and a required check that never runs
    # leaves the pull request permanently unmergeable: GitHub waits forever for
    # a status that is not coming. That is the standard trap with path filtering
    # plus branch protection.
    #
    # For the same reason, every consumer below carries `if: ${{ !cancelled() }}`
    # and treats a NON-SUCCESSFUL classification as "run everything":
    #
    #   run  when  needs.changes.result != 'success' || outputs.X == 'true'
    #   skip when  needs.changes.result == 'success' && outputs.X != 'true'
    #
    # Without that, a failure in THIS job would skip its dependents, and a
    # skipped required check strands the pull request exactly as above. The
    # script already fails open on anything it cannot classify; these conditions
    # extend the same guarantee to the job failing outright, so "fail open" holds
    # at both levels rather than only inside the script.
    outputs:
      app: ${{ steps.filter.outputs.app }}
      image: ${{ steps.filter.outputs.image }}
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history back to the base commit to diff against it.
          fetch-depth: 0

      - name: Classify the changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Fail open, always. A push to main gates the deployable state and is
          # never filtered; anything unexpected also runs everything. This filter
          # exists to make CI cheaper, never to make it less trustworthy.
          if [ "$EVENT" != "pull_request" ] || [ -z "${BASE_SHA:-}" ]; then
            echo "Not a filterable pull request — running everything."
            printf 'app=true\nimage=true\nsql=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$changed"
          echo

          matches() { echo "$changed" | grep -qE "$1"; }

          # The suite validates application behaviour, so anything capable of
          # changing that behaviour must run it: the code, the tests themselves,
          # the dependency set, the runtime it executes on, and the schema the
          # tests load. Getting this too NARROW recreates the exact gap the
          # docker-build job was added to close — CI passing on something other
          # than what ships. Only genuinely inert paths fall through: *.md,
          # .github/ISSUE_TEMPLATE/. (`landing/` was named here until #299 moved
          # it to its own repo — note it was never IN the pattern, it fell
          # through by omission, which is why removing it changes nothing.)
          if matches '^(app/|tests/|scripts/|sql/|requirements.*\.txt$|Dockerfile$|pyproject\.toml$|pytest\.ini$|setup\.cfg$|\.github/workflows/ci\.yml$)'; then
            app=true
          else
            app=false
          fi

          # A second, in-image run of the same suite is justified by a change to
          # the SHIPPED runtime — and by a change to the TESTS, because the whole
          # point of that run is that the image is not the dev container.
          #
          # ⚠️ `tests/` is in here because leaving it out made this class of
          # failure invisible until AFTER merge, twice (#176, then #218). The dev
          # bind mount serves files `.dockerignore` strips, so a test that reads
          # one passes locally and on the PR, then fails on the push to main —
          # green everywhere a human looks before merging. That is exactly the
          # "too NARROW" failure the app filter's comment above warns about; the
          # app filter already counts `tests/` for the same reason.
          #
          # ⚠️ ci.yml is in here for the reason the sql filter carries it: a
          # change to THIS classifier changes what runs, so it has to run against
          # itself. Without it, the pull request that edits this line cannot
          # exercise the step it is editing, and reports SUCCESS having checked
          # nothing.
          if matches '^(Dockerfile$|requirements.*\.txt$|tests/|\.github/workflows/ci\.yml$)'; then
            image=true
          else
            image=false
          fi

          # ci.yml is in here for the same reason the app flag carries it: a
          # change to the migrations job changes what that job ASSERTS, so it
          # has to run against itself. Without this a ci.yml-only pull request
          # classifies as sql=false, every step in the job skips, and it reports
          # SUCCESS — which is indistinguishable from having actually checked
          # anything. That is precisely how #159 stayed invisible.
          if matches '^(sql/|scripts/migrate\.py$|\.github/workflows/ci\.yml$)'; then
            sql=true
          else
            sql=false
          fi

          echo "app=$app  image=$image  sql=$sql"
          printf 'app=%s\nimage=%s\nsql=%s\n' "$app" "$image" "$sql" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠️ `version:` is PINNED, and must equal the ruff pin in
      # requirements-dev.txt — tests/test_lint_local.py asserts the two agree.
      # Without it the action installs whatever ruff is newest, so a release
      # adding a rule turns this job red against code that `./test.sh` just
      # passed locally. Local predicting CI is the entire point of #264; an
      # unpinned linter here quietly gives that back.
      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.4
          args: check --output-format github

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the steps run.
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: budget
      DB_USER: budget
      DB_PASSWORD: budget
      SECRET_KEY: ci-secret-key
      # ENABLE_DIGEST_SCHEDULER and COOKIE_SECURE are deliberately unset. The
      # first would start the mail scheduler; the second sets Secure-only
      # cookies, which the test client — plain http — would never send back.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.app == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        if: needs.changes.result != 'success' || needs.changes.outputs.app == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Load schema
        if: needs.changes.result != 'success' || needs.changes.outputs.app == 'true'
        # ON_ERROR_STOP is load-bearing: psql exits 0 on SQL errors inside a
        # file unless it is set, so without it a half-loaded schema reports
        # success here and surfaces as confusing failures in the suite instead.
        run: psql "postgresql://budget:budget@localhost:5432/budget" -v ON_ERROR_STOP=1 -f sql/schema.sql

      # `-n auto` = one worker per runner CPU. Safe because tests/conftest.py
      # derives its TEST_PREFIX from the xdist worker id, so workers never share
      # database rows; see the note there before changing how test users are
      # named. Runs against the single `db` service — the isolation is by row
      # ownership, not by database.
      - name: Run tests
        if: needs.changes.result != 'success' || needs.changes.outputs.app == 'true'
        run: pytest -q -n auto

      # The job still reports success, so the required check is satisfied.
      - name: No application changes
        if: needs.changes.result == 'success' && needs.changes.outputs.app != 'true'
        run: echo "Nothing under app/, tests/, sql/, scripts/ or the dependency set changed — suite skipped."

  migrations:
    name: Migrations apply to the current schema
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    # The plan for this phase wanted CI to assert that schema.sql and the
    # numbered migrations produce identical schemas. That is impossible here:
    # the numbered files are forward-only deltas, not a replayable history —
    # `users` is created only in schema.sql, so most of the chain fails from
    # empty and the tables it builds are a fraction of schema.sql's. So this job
    # asserts the property that actually matters and is actually true: a
    # migration added in this pull request applies cleanly to the schema
    # PRODUCTION would apply it to.
    #
    # ⚠️ This comment used to say "yields 4 tables of 13". #309 measured it and
    # got different figures — the counts were true when written and every
    # migration since has moved them. sql/schema.sql's header carries the
    # command that measures it instead of a number that rots.
    #
    # ⚠️ Getting there requires the MERGE BASE's schema.sql, not HEAD's, and
    # that is not a refinement — it is the whole job (#159). The obvious
    # version of this asserted nothing at all for as long as it existed:
    # `migrate.py --baseline` records whatever `migration_files()` finds on
    # DISK, the pull request's new migration is on disk, so baselining recorded
    # it as applied WITHOUT EXECUTING IT. `migrate.py` then hit its `if not
    # pending:` branch and printed "Nothing to apply — up to date", which the
    # idempotency step below greps for and passed on too. A migration with a
    # syntax error went green through both.
    #
    # Baselining against the merge base's file list instead makes the new
    # migration genuinely pending. Loading the merge base's schema.sql is the
    # other half: the "reflected in schema.sql" step further down forces this
    # pull request to carry the change in schema.sql as well, so building from
    # HEAD's copy would apply the migration to a database that ALREADY contains
    # what it adds — a parse-and-no-op that asserts idempotency against the
    # post-migration schema rather than anything about a deploy.
    #
    # A pleasant consequence: a legitimately NON-idempotent migration is fine
    # here, because it lands on a schema that genuinely lacks the object. This
    # job does not quietly require every migration to be IF NOT EXISTS-guarded.
    #
    # HEAD's own schema.sql is not skipped — the fresh-database step below
    # loads it with ON_ERROR_STOP=1, so a broken one still fails this job.

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: budget
      DB_USER: budget
      DB_PASSWORD: budget

    steps:
      - uses: actions/checkout@v7
        with:
          # Need real history: this job checks out the MERGE BASE in a worktree
          # to reproduce what a deploy applies the migration to. The default
          # shallow clone has no commit to resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Install psycopg2
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        run: pip install psycopg2-binary

      - name: A fresh database from schema.sql has the app role
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        run: |
          # Its OWN database, so this asserts what schema.sql BUILDS rather than
          # whatever the steps around it happen to leave behind.
          #
          # ⚠️ Do not simplify this to "does budget_app exist in pg_roles". A
          # role is a CLUSTER-level object, so the load above has already
          # created it and that check passes here even against a schema.sql
          # carrying no role block at all — verified locally against the
          # pre-#160 file, which passed role-existence and failed on the
          # grants. The per-table DML check is the one doing the work.
          psql "postgresql://budget:budget@localhost:5432/budget" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE freshcheck'
          psql "postgresql://budget:budget@localhost:5432/freshcheck" \
            -v ON_ERROR_STOP=1 -q -f sql/schema.sql
          psql "postgresql://budget:budget@localhost:5432/freshcheck" \
            -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              offenders text;
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'budget_app') THEN
                  RAISE EXCEPTION 'schema.sql built a database with no budget_app role (#160).';
              END IF;

              IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'budget_app' AND rolsuper) THEN
                  RAISE EXCEPTION 'budget_app is a SUPERUSER — the entire point of the role is that it is not.';
              END IF;

              IF has_schema_privilege('budget_app', 'public', 'CREATE') THEN
                  RAISE EXCEPTION 'budget_app holds CREATE on schema public — the app performs no DDL and must not be able to.';
              END IF;

              -- Every table, not a representative one: a role block placed
              -- before the last CREATE TABLE would silently miss what follows.
              SELECT string_agg(c.relname, ', ' ORDER BY c.relname) INTO offenders
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND NOT (has_table_privilege('budget_app', c.oid, 'SELECT')
                     AND has_table_privilege('budget_app', c.oid, 'INSERT')
                     AND has_table_privilege('budget_app', c.oid, 'UPDATE')
                     AND has_table_privilege('budget_app', c.oid, 'DELETE'));
              IF offenders IS NOT NULL THEN
                  RAISE EXCEPTION 'budget_app lacks DML on: %. The role block must stay LAST in schema.sql — GRANT ON ALL TABLES binds what exists when it runs.', offenders;
              END IF;

              SELECT string_agg(c.relname, ', ' ORDER BY c.relname) INTO offenders
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'r'
                AND has_table_privilege('budget_app', c.oid, 'TRUNCATE');
              IF offenders IS NOT NULL THEN
                  RAISE EXCEPTION 'budget_app holds TRUNCATE on: % — deliberately withheld.', offenders;
              END IF;

              SELECT string_agg(c.relname, ', ' ORDER BY c.relname) INTO offenders
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'S'
                AND NOT (has_sequence_privilege('budget_app', c.oid, 'USAGE')
                     AND has_sequence_privilege('budget_app', c.oid, 'SELECT'));
              IF offenders IS NOT NULL THEN
                  RAISE EXCEPTION 'budget_app cannot use sequence(s): %', offenders;
              END IF;

              -- This repository is PUBLIC, so schema.sql sets no password and
              -- the role cannot log in until an operator sets one. Asserting it
              -- keeps a well-meaning "make it work out of the box" change loud.
              IF EXISTS (SELECT 1 FROM pg_authid WHERE rolname = 'budget_app' AND rolpassword IS NOT NULL) THEN
                  RAISE EXCEPTION 'budget_app has a password set. schema.sql is in a PUBLIC repository and must never set one.';
              END IF;

              RAISE NOTICE 'budget_app: present, DML on every table, no CREATE, no TRUNCATE, not superuser, no password.';
          END
          $$;
          SQL

      - name: Apply this pull request's migrations the way a deploy does
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          URL: postgresql://budget:budget@localhost:5432/budget
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main has no "before" to compare against, so the deploy
            # simulation does not apply. Build from HEAD and baseline; nothing
            # is pending by construction, and this run is not what gates a
            # migration anyway — the pull request that added it was.
            echo "Not a pull request — building from HEAD and baselining."
            psql "$URL" -v ON_ERROR_STOP=1 -q -f sql/schema.sql
            python scripts/migrate.py --baseline
            python scripts/migrate.py
            exit 0
          fi

          git fetch --no-tags origin "$BASE_REF"
          # No `|| true` here on purpose. If the merge base cannot be resolved
          # the honest outcome is a red job: silently falling back to HEAD is
          # the exact vacuum this job existed in for its whole life.
          base=$(git merge-base HEAD FETCH_HEAD)
          echo "Merge base: $base"

          git worktree add --detach ../base "$base"

          # The PREVIOUS schema — what production is running right now.
          psql "$URL" -v ON_ERROR_STOP=1 -q -f ../base/sql/schema.sql

          # The PREVIOUS migration list. migrate.py derives SQL_DIR from its own
          # location, so running the base worktree's copy baselines the base's
          # sql/ listing without the script needing to know any of this. That is
          # the whole trick: anything this pull request ADDS is left unrecorded,
          # and is therefore genuinely pending below.
          python ../base/scripts/migrate.py --baseline

          # HEAD's migrations, executed for real against the pre-migration
          # schema. This is the assertion the job's name has always claimed.
          python scripts/migrate.py

      - name: Runner is idempotent
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        run: |
          # Only meaningful because the step above genuinely applied something.
          # While that step baselined the new migration instead of running it,
          # this grep matched the "up to date" of a run that had done NOTHING —
          # a second vacuous check stacked on the first (#159).
          out=$(python scripts/migrate.py)
          echo "$out"
          if ! echo "$out" | grep -q "up to date"; then
            echo "::error::Second run was not a no-op — the runner is not idempotent."
            exit 1
          fi

      - name: A new migration must also be reflected in schema.sql
        if: needs.changes.result != 'success' || needs.changes.outputs.sql == 'true'
        run: |
          # The drift this catches: adding sql/NN without updating schema.sql,
          # so a fresh database silently lacks what production has. Compares
          # against the merge base rather than the whole history.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}" || true
          base=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo "")
          [ -z "$base" ] && { echo "no merge base — skipping"; exit 0; }

          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- 'sql/[0-9]*.sql' || true)
          if [ -z "$added" ]; then
            echo "No new migration in this change."
            exit 0
          fi
          echo "New migration(s): $added"

          if git diff --name-only "$base" HEAD -- sql/schema.sql | grep -q .; then
            echo "schema.sql updated alongside it."
          else
            echo "::error::$added was added but sql/schema.sql was not updated."
            echo "schema.sql builds fresh databases (dev, CI, a rebuilt server)."
            echo "Leaving it behind means a fresh database silently lacks this change."
            exit 1
          fi

      # The job still reports success, so the required check is satisfied.
      - name: No schema changes
        if: needs.changes.result == 'success' && needs.changes.outputs.sql != 'true'
        run: echo "Nothing under sql/ or scripts/migrate.py changed — migration checks skipped."

  docker-build:
    name: Image builds and runs as non-root
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    # Nothing here needs the registry — this job proves the image is sound, it
    # does not publish it. Pushing happens in the release workflow.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: budget-buddy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The reason this job exists. Until now CI installed dependencies on the
      # runner and ran pytest against them — it never built the Dockerfile at
      # all. A broken Dockerfile, or a regression in the non-root user change,
      # would have sailed through completely untested.
      - name: Container runs as the unprivileged appuser
        run: |
          actual=$(docker run --rm budget-buddy:ci whoami)
          echo "container user: $actual"
          if [ "$actual" != "appuser" ]; then
            echo "::error::Image runs as '$actual', expected 'appuser'."
            exit 1
          fi

      # The Dockerfile has a `dev` stage carrying pytest for ./test.sh, and the
      # build above passes no --target, so it gets the FINAL stage. This asserts
      # that final stage is still `prod`. Reordering the stages so `dev` lands
      # last would otherwise ship the test dependencies to production silently —
      # nothing else in the pipeline would notice.
      - name: Shipped image carries no test dependencies
        run: |
          if docker run --rm budget-buddy:ci python -c 'import pytest' 2>/dev/null; then
            echo "::error::pytest is present in the shipped image. The Dockerfile's final stage must be 'prod', not 'dev' — see the note at the top of that file."
            exit 1
          fi
          echo "no pytest in the shipped image, as expected"

      # Its own step because two things need it now: the boot check below and,
      # when the shipped runtime changes, the in-image suite after that.
      - name: Start Postgres and load the schema
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_USER=budget -e POSTGRES_PASSWORD=budget -e POSTGRES_DB=budget \
            postgres:16
          # ⚠️ Probe over TCP (`-h 127.0.0.1`), NEVER the default unix socket.
          # The entrypoint runs initdb against a TEMPORARY server started with
          # `-c listen_addresses=''` — socket only, no TCP — then stops it with
          # `pg_ctl -m fast -w stop` and starts the real one. A socket probe
          # reports READY against that throwaway server, so the loop breaks
          # early and the psql below lands in the shutdown window:
          #   FATAL: the database system is shutting down
          # That is #281, and it is sub-second, so it fails perhaps one run in
          # many — a re-run goes green and hides it. The temp server never
          # listens on TCP at all, so a TCP probe cannot see it: the race is
          # removed rather than made less likely.
          ready=""
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -h 127.0.0.1 -U budget >/dev/null 2>&1 && { ready=1; break; }
            sleep 2
          done
          # Fail HERE, loudly, rather than letting psql fail with a message
          # about something else. Without this the loop just falls through on
          # exhaustion and runs the load anyway, which is how the cause above
          # reached the log as one confusing line instead of a clear timeout.
          if [ -z "$ready" ]; then
            echo "Postgres never accepted a TCP connection after 60s"
            docker logs ci-db
            exit 1
          fi
          # ON_ERROR_STOP: psql exits 0 on SQL errors in a file without it.
          docker exec -i ci-db psql -U budget -d budget -v ON_ERROR_STOP=1 < sql/schema.sql

      - name: Gunicorn boots and serves a request
        run: |
          docker run -d --name ci-web --network ci-net -p 5001:5000 \
            -e DB_HOST=ci-db -e DB_PORT=5432 -e DB_NAME=budget \
            -e DB_USER=budget -e DB_PASSWORD=budget \
            -e SECRET_KEY=ci-secret-key \
            budget-buddy:ci

          # The login page is unauthenticated, so a 200 proves the whole stack
          # came up: gunicorn, the app factory, and the template layer.
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/login || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::App did not serve /login. Container logs:"
            docker logs ci-web
            exit 1
          fi
          echo "GET /login -> 200"

      # The `Tests` job runs the suite on the RUNNER's Python via setup-python,
      # which is not necessarily the Python the image ships. That gap is not
      # hypothetical: a Dependabot PR moving the base image 3.11 -> 3.14 could go
      # fully green with all 579 tests having executed on the runtime being
      # replaced. So when the shipped runtime itself changes, run the suite
      # inside the built image as well.
      #
      # That exact bump was then made deliberately (#8), and this step is what
      # produced the evidence for it — which is why #8 was blocked on this step
      # existing (#7) rather than being waved through on a green tick.
      #
      # Gated because it roughly doubles the test path. A Dockerfile or
      # requirements change is rare; ordinary application PRs keep the fast
      # runner job and pay nothing.
      - name: Test suite runs inside the shipped image
        if: needs.changes.result != 'success' || needs.changes.outputs.image == 'true'
        run: |
          docker run --rm --network ci-net \
            -e DB_HOST=ci-db -e DB_PORT=5432 -e DB_NAME=budget \
            -e DB_USER=budget -e DB_PASSWORD=budget \
            -e SECRET_KEY=ci-secret-key \
            budget-buddy:ci sh -c '
              python --version
              pip install -q -r requirements-dev.txt
              # `python -m pytest`, not bare `pytest`: the image runs as the
              # non-root appuser, so pip puts console scripts in
              # /home/appuser/.local/bin, which is not on PATH. Going through
              # the module also guarantees the interpreter that did the install
              # is the one that runs. -p no:cacheprovider because /app is
              # root-owned (WORKDIR created it before the COPY --chown).
              python -m pytest -q -p no:cacheprovider -n auto
            '

      - name: Confirm what the image test covered
        if: needs.changes.result == 'success' && needs.changes.outputs.image != 'true'
        run: echo "Shipped runtime unchanged (no Dockerfile or requirements change) — in-image suite skipped."

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-web || true
