name: Rollback

# Immutable version tags make rollback trivial — but only if the button already
# exists. Do not wait until it is needed to write this.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to roll back to, e.g. 0.1.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

# Never let a rollback race a release deploy. Shares the `release` group on
# purpose, and a rollback in flight is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll the Droplet back
    runs-on: ubuntu-latest
    # Also gated: the deploy secrets live on this environment, so any job that
    # touches the Droplet has to pass through the same approval. One extra click
    # at 11pm is the price of the key never being readable by an ungated job.
    environment: production
    steps:
      - name: Confirm the target image exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Fail here rather than after the Droplet has already pulled a
          # nonexistent tag and compose has torn the old container down.
          token=$(curl -s "https://ghcr.io/token?scope=repository:caddismaster/budget-buddy:pull" \
                  | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${token}" \
                 -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                 "https://ghcr.io/v2/caddismaster/budget-buddy/manifests/${VERSION}")
          if [ "$code" != "200" ]; then
            echo "::error::No image tagged '${VERSION}' in ghcr (manifest lookup returned ${code})."
            exit 1
          fi
          echo "Found ghcr.io/caddismaster/budget-buddy:${VERSION}"

      - name: Deploy that version
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
          USER_NAME: ${{ vars.DROPLET_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # `pull web` only — a rollback must not drag the database engine along
          # with it. See release.yml.
          #
          # The .env pin (#190) matters MORE here than on a deploy: without it a
          # rollback leaves the box naming the version it just rolled away from,
          # so the next bare `docker compose up -d` quietly rolls production
          # FORWARD again. It is also what lets the trailing bare
          # `docker compose ps` resolve at all, now that the image has no default.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              "${USER_NAME}@${HOST}" \
              "set -e
               cd /opt/budget-buddy
               touch .env.tmp
               chmod 600 .env.tmp
               grep -v '^TAG=' .env > .env.tmp
               printf 'TAG=%s\n' '${VERSION}' >> .env.tmp
               mv .env.tmp .env
               echo \"pinned \$(grep '^TAG=' .env)\"
               TAG='${VERSION}' docker compose pull web
               TAG='${VERSION}' docker compose up -d

               # #305 — confirm the container that came up IS the version asked
               # for. A rollback is the case where guessing is least acceptable,
               # and the /healthz check below cannot tell 'rolled back to 0.7.0'
               # from 'never left 0.9.0' — it returns 200 from either.
               #
               # ⚠️ An UNSTAMPED image is tolerated, unlike in release.yml. Every
               # image built before #305 reports nothing here, and those are
               # exactly the versions a rollback reaches for. Failing the run
               # would break rolling back to them — during an incident, which is
               # the worst possible time to be strict about a metadata gap. A
               # WRONG stamp is still a hard failure; only a missing one warns.
               RUNNING=\"\$(docker compose exec -T web printenv APP_VERSION | tr -d '\r')\"
               if [ -z \"\$RUNNING\" ] || [ \"\$RUNNING\" = 'dev' ]; then
                 echo \"::warning::Rolled back to ${VERSION}, which predates the version stamp (#305) — cannot verify what is running.\"
               elif [ \"\$RUNNING\" != '${VERSION}' ]; then
                 echo \"::error::Asked for ${VERSION} but the running container reports '\$RUNNING'\"
                 exit 1
               else
                 echo \"running version \$RUNNING (matches ${VERSION})\"
               fi

               docker compose ps"

      - name: Verify the rolled-back app is healthy
        run: |
          ok=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   https://budget.seandesmet.com/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "attempt $i: /healthz -> $code"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Rolled back to ${{ inputs.version }} but /healthz is not 200."
            exit 1
          fi
          echo "Rolled back to ${{ inputs.version }} and healthy."

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
