version: 2

updates:
  # requirements.txt is fully pinned, which is deliberate — a reproducible image
  # matters more than automatic drift. The trade-off is that security fixes only
  # arrive if something opens the PR, hence this file.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # #588: pytest 9.2 silently breaks xdist 3.8.0's --dist loadgroup, and the
    # sweep tests then fail at random. Remove once an xdist release after 3.8.0
    # is in; tests/test_xdist_grouping.py proves the pair works.
    ignore:
      - dependency-name: pytest
        versions: [">=9.2"]
    groups:
      # Minor and patch bumps arrive as one PR so the suite gates them together
      # rather than trickling in ten near-identical runs.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The Ansible control node (#553), pinned the same way. The collections in
  # infra/ansible/requirements.yml have no ecosystem here: they move by hand.
  - package-ecosystem: pip
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    groups:
      infra-minor-and-patch:
        update-types: ["minor", "patch"]

  # Workflow actions age out and get deprecated — this is what catches it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]

  # #498: compose's own images. redis is pinned by tag + digest like the
  # Dockerfile's base, and only this ecosystem can move it. postgres is
  # IGNORED on purpose: any edit to the db service recreates the database,
  # and install_compose.sh refuses such a release. Postgres moves in a
  # scheduled window instead (#500).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    ignore:
      - dependency-name: postgres
