{% extends 'base.html' %}
{% block title %}Change password — Budget Buddy{% endblock %}
{% block page_heading %}<h1>Change password</h1>{% endblock %}
{% block content %}
<form method="post" class="narrow-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current_password">Current password</label>
  <input type="password" id="current_password" name="current_password" required
         autocomplete="current-password">
  <label for="new_password">New password</label>
  <input type="password" id="new_password" name="new_password" required
         autocomplete="new-password">
  {% with field_id = 'new_password' %}{% include 'partials/_password_rules.html' %}{% endwith %}
  <button type="submit" class="btn btn-primary" style="margin-top:1.5rem">Update password</button>
</form>
{% endblock %}
