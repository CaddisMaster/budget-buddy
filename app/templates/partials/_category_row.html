{# #243 — three columns: the Kind cell went with the grouping (the heading the
   row sits under states its kind). Editing kind is still possible — see the
   edit-row partial — and a kind change re-renders the whole grouped listing. #}
<tr id="category-{{ cat.id }}">
  <td>{{ cat.name }}</td>
  <td>{{ cat.description }}</td>
  <td class="row-actions">
    <button type="button" class="btn btn-sm"
      hx-get="{{ url_for('categories.edit_category', category_id=cat.id) }}"
      hx-target="#category-{{ cat.id }}" hx-swap="outerHTML">Edit</button>
    <button type="button" class="btn btn-sm btn-danger"
      hx-delete="{{ url_for('categories.delete_category', category_id=cat.id) }}"
      hx-target="#category-{{ cat.id }}" hx-swap="outerHTML"
      hx-confirm="Delete this category?">Delete</button>
  </td>
</tr>
