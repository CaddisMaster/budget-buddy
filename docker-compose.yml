services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      # Bind Postgres to localhost only — never expose the DB to the public internet.
      # Docker publishes ports by bypassing ufw, so "5432:5432" = world-reachable.
      - "127.0.0.1:5432:5432"
  web:
    # The Release workflow deploys by passing the exact version it just published
    # (`TAG=0.1.0 docker compose up -d`), so prod runs an immutable, traceable tag
    # rather than whatever `latest` happened to be. The fallback keeps a hand-run
    # `docker compose up -d` on the Droplet working.
    # NOTE: local dev never uses this line — docker-compose.override.yml replaces
    # it with a source build.
    image: ghcr.io/caddismaster/budget-buddy:${TAG:-latest}
    restart: always
    env_file:
      - .env
    ports:
      # Localhost only — Nginx reverse-proxies to 127.0.0.1:5001. A bare "5001:5000"
      # publishes to 0.0.0.0 and (Docker bypasses ufw) exposes the app over plain
      # HTTP on the public IP, bypassing HTTPS. Keep it bound to localhost.
      - "127.0.0.1:5001:5000"
    # The base image is python:slim and carries no curl or wget, so the probe
    # goes through Python. start_period covers the first boot, during which a
    # non-200 is expected rather than a failure.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - db
volumes:
  postgres_data:
