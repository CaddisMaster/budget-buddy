services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      # Bind Postgres to localhost only — never expose the DB to the public internet.
      # Docker publishes ports by bypassing ufw, so "5432:5432" = world-reachable.
      - "127.0.0.1:5432:5432"
    # ⚠️ THIS BLOCK IS WHY THE DATABASE CONTAINER EVER GETS RECREATED (#150).
    # Without it Docker's default json-file driver has no max-size and no
    # max-file, so the log grows until the disk fills — and `db` is the one
    # container that is NEVER recycled, because release.yml deliberately runs
    # `docker compose pull web` so that shipping app code cannot restart the
    # database (issue #22). `web` self-limits by accident: every deploy recreates
    # it, and a new container starts a new log file.
    #
    # Measured before this was added: the db log had reached 46,982 bytes over
    # 14 days (~3.3 KB/day), so the steady-state risk is remote. The real
    # exposure is a FAULT LOOP — a crash-looping container or a repeating
    # Postgres error writing gigabytes in days — which has no warning, because
    # /healthz stays green until Postgres actually cannot write.
    #
    # ⚠️ Editing anything in this service's definition makes the next
    # `docker compose up -d` RECREATE the database container. That is a
    # deliberate, scheduled operation with a verified dump in hand — see
    # RUNBOOK.md §7. Never let it happen as a side effect of a release.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    # The Release workflow deploys by passing the exact version it just published
    # (`TAG=0.1.0 docker compose up -d`), so prod runs an immutable, traceable tag
    # rather than whatever `latest` happened to be.
    #
    # ⚠️ THERE IS DELIBERATELY NO DEFAULT (#190). This used to read `${TAG:-latest}`
    # so that a hand-run `docker compose up -d` on the Droplet "still worked" — but
    # the Droplet's local `latest` is stale BY CONSTRUCTION: deploys pull the exact
    # version tag and never `latest`, so nothing on the box ever refreshes it. On
    # 2026-08-10 a bare `up -d` therefore moved production from :0.6.0 back to the
    # 0.3.1 image — three releases and two migrations — and gave no signal at all:
    # container healthy, /healthz 200, uptime check green. The convenience the
    # fallback bought was the bug.
    #
    # Two things replace it. The deploy writes `TAG=<version>` into the Droplet's
    # .env (release.yml AND rollback.yml), so a bare `up -d` reproduces the running
    # version and `grep ^TAG= .env` reads it off the host. And if that line is ever
    # missing, EVERY compose command fails naming TAG rather than silently
    # selecting an unrelated image. An explicit `TAG=` on the command line still
    # wins over .env, which is what makes the automated deploys authoritative.
    #
    # NOTE: local dev never runs this image — docker-compose.override.yml replaces
    # it with a source build. It is still interpolated (compose resolves each file
    # before merging), so a local .env needs a TAG line too; see .env.example.
    image: ghcr.io/caddismaster/budget-buddy:${TAG:?TAG is not set — pass TAG=<version>, or see RUNBOOK §5}
    restart: always
    env_file:
      - .env
    ports:
      # Localhost only — Nginx reverse-proxies to 127.0.0.1:5001. A bare "5001:5000"
      # publishes to 0.0.0.0 and (Docker bypasses ufw) exposes the app over plain
      # HTTP on the public IP, bypassing HTTPS. Keep it bound to localhost.
      - "127.0.0.1:5001:5000"
    # The base image is python:slim and carries no curl or wget, so the probe
    # goes through Python. start_period covers the first boot, during which a
    # non-200 is expected rather than a failure.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - db
    # Belt and braces (#150). `web` already resets its log on every deploy, so
    # this caps the one window that matters: a crash loop between releases.
    # Unlike the db block above, changing this is free — a release recreates
    # this container anyway.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
